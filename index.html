<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV | Dra. Alix Camacho - Odontóloga</title>
  <meta name="description" content="Curriculum Vitae Profesional de la Dra. Alix Camacho C., Odontóloga Integral y Estética.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030406;
      --bg-panel: rgba(20, 24, 30, 0.6);
      --gold: #d4af37;
      --gold-light: #f9df9f;
      --text-main: #f0f0f0;
      --text-muted: #a3a3a3;
      --border: rgba(212, 175, 55, 0.2);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05), transparent 25%);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      font-size: 14px;
    }

    a { color: var(--gold-light); text-decoration: none; transition: color 0.3s ease; }
    a:hover { color: var(--gold); }

    .cv-container {
      max-width: 1000px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
      padding: 0 20px;
    }

    /* COLUMNA IZQUIERDA (Perfil y Contacto) */
    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      height: fit-content;
      position: sticky;
      top: 40px;
    }

    .profile-img-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--bg-dark);
    }

    .name-title {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .name-title h1 {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .name-title h2 {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .sidebar-section { margin-bottom: 30px; }
    
    .sidebar-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: var(--gold-light);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-list { list-style: none; }
    .contact-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .contact-list i { color: var(--gold); font-size: 14px; width: 16px; text-align: center; }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .skills-list span {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border);
      color: var(--gold-light);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
    }

    /* COLUMNA DERECHA (Experiencia y Educación) */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .content-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .section-header {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      color: var(--gold);
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-header i { font-size: 18px; }

    .timeline-item {
      position: relative;
      padding-left: 25px;
      margin-bottom: 30px;
      border-left: 1px solid var(--border);
    }
    
    .timeline-item:last-child { margin-bottom: 0; }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 5px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .item-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .item-subtitle {
      font-size: 12px;
      color: var(--gold-light);
      margin-bottom: 8px;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.5px;
    }

    .item-date {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
